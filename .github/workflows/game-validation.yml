name: Night Shift - fase 8 restaurada
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test test/*.test.js
      - run: npm run build
      - run: npm install --no-save playwright
      - name: Chrome do runner
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node test/browser-smoke.mjs
